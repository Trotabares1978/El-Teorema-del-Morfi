name: Build organic intro v2
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[organic-intro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build transparent layers
        run: |
          python -m pip install --disable-pip-version-check pillow opencv-python-headless
          python tools/build_organic_intro.py
      - name: Commit generated intro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app/src/main/assets/morfi_intro_layers
          git diff --cached --quiet || git commit -m "Construir intro orgánica por capas [organic-intro]"
          git push

# trigger organic build
