name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect Android SDK
        run: |
          set -e
          SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find /home/runner -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Prepare Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"
      - name: Download intro audio
        run: |
          set -e
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --output "app/src/main/res/raw/el_teorema_del_morfi.mp3" "https://uc06699e5e4815218424e06284a5.dl.dropboxusercontent.com/cd/0/get/DIxm4_f5E7R8sYhLmbHnzoCIIOL0vW8kjamv8c2i5UFZuHLdLfUOEa5hTAihUkbxRZnoLNhI6fc2hO8QP_ZtAgw83dgl3EfZGZLST2BGOw_riHknqrQUX7-FirJy_ZPcc3WavMdekYWfDZ1FqCfj9DyG8bTLHyaZ3EgyHNiwYl4hKw/file?c_luid=e65e5e1e"
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify audio is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "el_teorema_del_morfi"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Teorema-del-Morfi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
