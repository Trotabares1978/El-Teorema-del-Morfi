name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore intro illustration from repository data
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable
          cat app/src/main/assets/morfi_b64_256/part00.txt app/src/main/assets/morfi_b64_256/part01.txt app/src/main/assets/morfi_b64_256/part02.txt app/src/main/assets/morfi_b64_256/part03.txt app/src/main/assets/morfi_b64_256/part04.txt app/src/main/assets/morfi_b64_256/part05.txt app/src/main/assets/morfi_b64_256/part06.txt | tr -d '\n\r[:space:]' | base64 -d > app/src/main/res/drawable/morfi_intro.jpg
          file app/src/main/res/drawable/morfi_intro.jpg
          test -s app/src/main/res/drawable/morfi_intro.jpg
          echo "302a0b326663204582bc99d279cf2ccbe0e84cd10e6d5210b8c7d510c05a79f1  app/src/main/res/drawable/morfi_intro.jpg" | sha256sum -c -

      - name: Verify intro audio is local
        run: |
          set -e
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          ls -lh "app/src/main/res/raw/el_teorema_del_morfi.mp3"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android SDK
        run: |
          set -e
          SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find /home/runner -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify intro image is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "morfi_intro"

      - name: Verify audio is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "el_teorema_del_morfi"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Teorema-del-Morfi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
