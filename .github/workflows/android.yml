name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download real intro illustration
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          HOST='https://media.canva.com'
          P1='/v2/document-image/hash:1062200032/height=547/id:DAHWK2xoZJw/type:B/width=365'
          P2='?brand=BAF9nfCSQOI&csig=AAAAAAAAAAAAAAAAAAAAAHJ6ZTW6rHUq-FMKNzL8BfO_TjJ1EiFo_PDhv0TxX28e&exp=1790307523'
          P3='&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FxoZJw%2FDAHWK2xoZJw%2F1%2Fthumbnail%2F0001.png'
          P4='&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
          curl -fL --retry 3 --retry-all-errors "$HOST$P1$P2$P3$P4" -o app/src/main/res/drawable/morfi_intro.jpg
          file app/src/main/res/drawable/morfi_intro.jpg
          test -s app/src/main/res/drawable/morfi_intro.jpg

      - name: Verify intro audio is local
        run: |
          set -e
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          ls -lh "app/src/main/res/raw/el_teorema_del_morfi.mp3"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android SDK
        run: |
          set -e
          SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find /home/runner -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify intro image is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "morfi_intro"

      - name: Verify audio is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "el_teorema_del_morfi"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Teorema-del-Morfi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
