name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME/platforms/android-35" || (echo "ERROR: falta Android 35"; exit 1)
          echo "SDK del runner OK"

      - name: Download intro audio
        run: |
          set -e
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --output "app/src/main/res/raw/el_teorema_del_morfi.mp3" "https://uc6fa69bb65f5e2e1595a3892c42.dl.dropboxusercontent.com/cd/0/get/DIwJU1EDmIwBd168XU_wjoEnexFFvXaiWW565F7_aVCUpPtgrDzq-8VtqpBV4iNshVKTdSchLqepNm8b7_LGd5aYVY5kBF4zeHEpMUUuCfRb9fj5atxbPK_6FmgSjKYiBHjsVanNCL8CwHFL6X0lmLlHi3RzvHfpISnif19S1CqG5g/file?c_luid=e65e5e1e"
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          file "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          ls -lh "app/src/main/res/raw/el_teorema_del_morfi.mp3"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify audio is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "el_teorema_del_morfi"
          echo "AUDIO PRESENTE EN EL APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Teorema-del-Morfi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
