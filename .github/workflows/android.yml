name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Seed intro audio into repository (one-time)
        if: ${{ !hashFiles('app/src/main/res/raw/el_teorema_del_morfi.mp3') }}
        run: |
          set -e
          mkdir -p app/src/main/res/raw
          curl -fL --retry 3 --output "app/src/main/res/raw/el_teorema_del_morfi.mp3" "https://uccdcbfb3f8b0a62644d69e1ed61.dl.dropboxusercontent.com/cd/0/get/DIyu02kizP1ZuNOwmGWt_3NcVyQ9CtJfSQC8s8SDDFjGLEg8ETOWTsCis0TBK2Mio1hHnDetg2Dmb1tkKDt2AFaut1JDC9N3GxogtYcPcJJ_cIe1SDAYSf2Zx3yEmXEnx2f_o080w5AVYuDbNWeJZV9t443OwsFZhxlFaXaZ7KX6Fw/file?c_luid=e65e5e1e"
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/raw/el_teorema_del_morfi.mp3
          git commit -m "Incorpora audio de introducción al proyecto"
          git push

      - name: Verify intro audio is local
        run: |
          set -e
          test -s "app/src/main/res/raw/el_teorema_del_morfi.mp3"
          ls -lh "app/src/main/res/raw/el_teorema_del_morfi.mp3"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android SDK
        run: |
          set -e
          SDKMANAGER="$(find /usr/local/lib/android /opt/android-sdk /usr/lib/android-sdk -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(find /home/runner -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"; fi
          test -n "$SDKMANAGER"
          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Prepare Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Verify audio is inside APK
        run: |
          set -e
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -i "el_teorema_del_morfi"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Teorema-del-Morfi-debug
          path: app/build/outputs/apk/debug/app-debug.apk
