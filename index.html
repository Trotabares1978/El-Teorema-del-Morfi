<title>El Teorema del Morfi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f0e4}
body{display:flex;align-items:center;justify-content:center}
.scene{position:relative;width:min(100vw,66.6667vh);height:min(150vh,100vh);max-width:100vw;max-height:100vh;overflow:hidden;background:#f6f0e4}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.art{position:absolute;inset:0;width:100%;height:100%}
.layer{opacity:0}
.path{animation:fade 2.2s .15s ease-out forwards}
.b1{animation:fade 1s 2.1s ease-out forwards}.b2{animation:fade 1s 2.45s ease-out forwards}
.b3{animation:fade 1s 2.8s ease-out forwards}.b4{animation:fade 1s 3.15s ease-out forwards}
.title{animation:fade 1.05s 3.8s ease-out forwards}
.matias{animation:matias 1.45s 4.7s ease-out forwards}
.enter{animation:fade 1s 6.15s ease-out forwards;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes matias{from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.hint{position:absolute;z-index:20;left:50%;bottom:12px;transform:translateX(-50%);border:0;border-radius:12px;padding:8px 12px;background:#fff9;color:#4b3629;font:700 13px Georgia,serif;display:none}
.hint.show{display:block}
@media (prefers-reduced-motion:reduce){.layer{animation:none!important;opacity:1!important}}
</style>

<script>
const music=document.getElementById('music'),hint=document.getElementById('hint'),enter=document.getElementById('enter'),scene=document.getElementById('scene');
let started=false;
async function startMusic(){
 if(started)return true;
 music.volume=.55;
 try{await music.play();started=true;hint.classList.remove('show');return true}catch(e){hint.classList.add('show');return false}
}
window.addEventListener('load',startMusic);
document.addEventListener('pointerdown',startMusic,{once:true});
document.addEventListener('touchstart',startMusic,{once:true,passive:true});
enter.addEventListener('click',async()=>{await startMusic();scene.style.transition='opacity .55s ease';scene.style.opacity='0';setTimeout(()=>location.href='menu.html',600)});
</script>
