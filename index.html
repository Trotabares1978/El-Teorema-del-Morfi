<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>El Teorema del Morfi</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e5}body{font-family:Georgia,serif;color:#3d2d22}.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.art{position:relative;width:min(100vw,66.6667vh);height:min(150vh,100vh);max-width:100vw;max-height:100vh;overflow:hidden}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.fore{opacity:0}.path{clip-path:polygon(48% 43%,52% 43%,73% 100%,19% 100%)}.places{clip-path:polygon(0 24%,100% 24%,100% 69%,0 69%)}.matias{clip-path:polygon(49% 48%,64% 46%,69% 82%,44% 84%)}.titleLayer{opacity:0;position:absolute;left:5%;right:5%;top:6.5%;text-align:center;transform:translateY(-8px) scale(.97);font-weight:900;letter-spacing:.055em;text-transform:uppercase;color:#513321;font-size:clamp(22px,5.2vw,52px);line-height:.92}.subtitle{font-size:.28em;letter-spacing:.18em;margin-top:.35em}.enter{position:absolute;left:50%;bottom:8%;transform:translate(-50%,18px) scale(.92);opacity:0;border:0;background:transparent;padding:0}.sign{display:block;padding:.48em 1.2em .55em;border-radius:8px;background:linear-gradient(#c99658,#9a6334);border:3px solid #6b4225;box-shadow:0 5px #54351f,0 9px 18px #0003;color:#fff7e8;font:900 clamp(20px,5vw,44px)/1 Georgia,serif;letter-spacing:.08em}.ready .path{animation:p 1.25s .35s forwards}.ready .places{animation:b 1.15s 1.55s forwards}.ready .matias{animation:m 1s 2.65s forwards}.ready .titleLayer{animation:t .8s 3.65s forwards}.ready .enter{animation:e .7s 4.55s forwards}@keyframes p{from{opacity:0;clip-path:polygon(50% 43%,50% 43%,50% 43%,50% 43%)}to{opacity:1;clip-path:polygon(48% 43%,52% 43%,73% 100%,19% 100%)}}@keyframes b{from{opacity:0;clip-path:inset(100% 0 0)}to{opacity:1;clip-path:inset(0)}}@keyframes m{from{opacity:0;clip-path:circle(0 at 57% 63%)}to{opacity:1;clip-path:polygon(49% 48%,64% 46%,69% 82%,44% 84%)}}@keyframes t{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}@keyframes e{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}#soundHint{position:absolute;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 14px;border:1px solid #fff8;border-radius:12px;background:#fff9;color:#3d2d22;font:700 13px Georgia,serif}</style></head><body><main><div class="scene"><div class="art" id="art"><img id="bg" class="layer"><img id="path" class="layer fore path"><img id="places" class="layer fore places"><img id="matias" class="layer fore matias"><div class="titleLayer">EL TEOREMA DEL MORFI<div class="subtitle">Más que un libro</div></div><button class="enter" id="enter"><span class="sign">ENTRAR</span></button></div></div><button id="soundHint">Tocá una vez para activar la música</button><audio id="music" loop></audio></main><script>const base='./app/src/main/assets/';const I=['morfi_b64/part00.txt','morfi_b64/part01.txt','morfi_b64/part02.txt'],B=['morfi_background_b64/part00.txt','morfi_background_b64/part01.txt'];async function b(a){return(await Promise.all(a.map(x=>fetch(base+x).then(r=>r.text())))).join('').replace(/\s/g,'')}async function boot(){const[i,g]=await Promise.all([b(I),b(B)]),u='data:image/jpeg;base64,'+i;bg.src='data:image/webp;base64,'+g;path.src=places.src=matias.src=u;music.src='./app/src/main/res/raw/el_teorema_del_morfi.mp3';requestAnimationFrame(()=>art.classList.add('ready'))}function sound(){music.volume=.55;music.play().then(()=>soundHint.style.display='none').catch(()=>{})}document.addEventListener('pointerdown',sound,{once:true});enter.onclick=()=>{sound();art.style.transition='opacity .55s,transform .55s';art.style.opacity=0;setTimeout(()=>location.href='menu.html',560)};boot().catch(console.error)</script></body></html>
